<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Central Park Control Console</title>
    <style>
        body {
            background-color: #1a3a6c;
            color: #d1d7e0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 30px;
            overflow-x: hidden;
            font-size: 1.4rem;
            font-weight: bold;
        }

        #terminal {
            width: 100%;
        }

        .input-line {
            display: flex;
            align-items: center;
            width: 100%;
        }

        input {
            background: transparent;
            border: none;
            color: #d1d7e0;
            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;
            outline: none;
            flex-grow: 1;
            margin-left: 10px;
        }

        #nedry-window {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            width: 320px;
            background: #c0c0c0;
            border: 3px solid #ffffff;
            border-right: 3px solid #444;
            border-bottom: 3px solid #444;
            padding: 4px;
            z-index: 1000;
            color: black;
        }

        .title-bar { background: #000080; color: white; padding: 2px 8px; font-size: 14px; }
        .alert-text { background: red; color: white; text-align: center; padding: 5px; animation: blink 0.2s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        #bucle-area { margin-top: 20px; }
    </style>
</head>
<body>

    <div id="terminal">
        <div>Jurassic Park, System Security Interface</div>
        <div>Version 4.0.5, Alpha E</div>
        <div>Ready...</div>
        <div id="log"></div>
        
        <div class="input-line" id="prompt-line">
            <span>></span>
            <input type="text" id="terminal-input" autofocus spellcheck="false">
        </div>
    </div>

    <div id="nedry-window">
        <div class="title-bar">Security System Error</div>
        <img src="nedry.gif" style="width:100%; border:2px solid black;">
        <div class="alert-text">YOU DIDN'T SAY THE MAGIC WORD!</div>
    </div>

    <div id="bucle-area"></div>

    <audio id="audioNedry" src="magic_word.mp3" loop></audio>

    <script>
        const input = document.getElementById('terminal-input');
        const log = document.getElementById('log');
        const bucleArea = document.getElementById('bucle-area');
        const ventanaNedry = document.getElementById('nedry-window');
        const audio = document.getElementById('audioNedry');
        const promptLine = document.getElementById('prompt-line');

        let errores = 0;

        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const val = input.value.toLowerCase();
                log.innerHTML += `<div>> ${input.value}</div>`;
                
                if (val.includes("access") && !val.includes("please")) {
                    errores++;
                    if (errores >= 3) {
                        iniciarVirus();
                    } else {
                        log.innerHTML += `<div>access: PERMISSION DENIED.</div>`;
                    }
                } else if (val.includes("please")) {
                    alert("ACCESS GRANTED");
                }

                input.value = ""; 
                window.scrollTo(0, document.body.scrollHeight);
            }
        });

        function iniciarVirus() {
            promptLine.style.display = 'none'; 
            ventanaNedry.style.display = 'block';
            audio.play();

            let contador = 0;
            const limite = 500; // AHORA SON 500

            const intervalo = setInterval(() => {
                if (contador < limite) {
                    const div = document.createElement('div');
                    div.textContent = "YOU DIDN'T SAY THE MAGIC WORD!";
                    bucleArea.appendChild(div);
                    contador++;
                    
                    // Esto hace que la pantalla baje automáticamente con el texto
                    window.scrollTo(0, document.body.scrollHeight);
                } else {
                    clearInterval(intervalo);
                }
            }, 30); // Velocidad aumentada para procesar las 500 líneas
        }
    </script>
</body>
</html>
